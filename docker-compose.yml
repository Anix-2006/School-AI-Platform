services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./ui:/app/ui

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: school_ai
      POSTGRES_PASSWORD: school_ai
      POSTGRES_DB: school_ai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
