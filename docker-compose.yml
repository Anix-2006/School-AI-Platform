services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./ui:/app/ui
      - ./data:/app/data
      # Matches the default WHISPER_MODEL_DIR=models/whisper under WORKDIR /app.
      - whisper-models:/app/models/whisper

volumes:
  whisper-models:
