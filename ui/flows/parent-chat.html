<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent chat — School Parent AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <button type="button" class="menu-btn" id="openSidebar" aria-label="Open menu">☰</button>
  <a class="topbar-brand" href="/">School Parent AI</a>
</header>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar" aria-label="App pages">
  <div class="sidebar-header">
    <h2>Pages</h2>
    <button type="button" class="close-btn" id="closeSidebar" aria-label="Close sidebar">×</button>
  </div>
  <div id="app-nav"></div>
</aside>
<main class="page">

  <h1>Parent chat</h1>
  <p class="lead">Parent app: send a message about your child and get a tool-grounded reply.</p>
  <div class="chat-shell">
    <div class="panel">
      <h3>Context</h3>
      <label for="guardianId">Parent</label>
      <select id="guardianId"><option value="">Loading…</option></select>
      <p class="meta" id="guardianMeta" style="margin-top:8px"></p>
      <p class="meta" id="authMeta" style="margin-top:12px">Connecting…</p>
    </div>
    <div class="chat-thread">
      <div class="chat-messages" id="messages">
        <div class="bubble bot">Hi — ask about attendance, homework, marks, or anything school-related.</div>
      </div>
      <div class="chat-compose">
        <textarea id="message" placeholder="Was my child present on 6 October?">Was my child present on 6 October?</textarea>
        <div class="actions">
          <button type="button" id="sendBtn">Send message</button>
        </div>
        <div id="chatError" class="error" hidden></div>
      </div>
    </div>
  </div>

</main>
<script src="/nav.js"></script>
<script src="/sidebar.js"></script>
<script src="/api.js"></script>

<script>
(() => {
  const messages = document.getElementById('messages');
  const err = document.getElementById('chatError');
  const authMeta = document.getElementById('authMeta');

  function addBubble(text, who, agent) {
    const el = document.createElement('div');
    el.className = 'bubble ' + who;
    el.textContent = text;
    if (agent) {
      const tag = document.createElement('span');
      tag.className = 'agent-tag';
      tag.textContent = 'helper: ' + agent;
      el.appendChild(tag);
    }
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  const guardianSelect = document.getElementById('guardianId');
  const guardianMeta = document.getElementById('guardianMeta');
  let guardians = [];
  let sessionId = String(Date.now());

  function showGuardian() {
    const g = guardians.find((x) => x.id === guardianSelect.value);
    if (!g) { guardianMeta.textContent = ''; return; }
    guardianMeta.textContent = `Child: ${g.student_name} (${g.student_id}) · Language: ${g.preferred_language}` +
      (g.has_consent ? '' : ' · No consent - the assistant will refuse to reply');
  }

  guardianSelect.addEventListener('change', () => {
    sessionId = String(Date.now());
    messages.innerHTML = '<div class="bubble bot">New conversation - ask about attendance, homework, marks, or anything school-related.</div>';
    showGuardian();
  });

  SchoolAPI.ensureAuth().then(async (s) => {
    authMeta.textContent = 'School: ' + s.tenantId;
    guardians = await SchoolAPI.fillGuardianSelect(guardianSelect);
    showGuardian();
  }).catch((e) => { authMeta.textContent = e.message; });

  document.getElementById('sendBtn').addEventListener('click', async () => {
    err.hidden = true;
    const message = document.getElementById('message').value.trim();
    if (!message || !guardianSelect.value) return;
    addBubble(message, 'user');
    document.getElementById('sendBtn').disabled = true;
    try {
      const data = await SchoolAPI.chat({
        guardian_id: guardianSelect.value,
        message,
        session_id: sessionId,
      });
      addBubble(data.reply || '(empty reply)', 'bot', data.agent_used);
    } catch (e) {
      err.hidden = false;
      err.textContent = e.message;
    } finally {
      document.getElementById('sendBtn').disabled = false;
    }
  });
})();
</script>

</body>
</html>
